<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONTHSARY</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
    overflow-x: hidden;
    color: var(--ink);
 
    background-color: var(--dusk);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(232, 192, 125, 0.55), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(224, 138, 106, 0.5), transparent 45%),
      radial-gradient(circle at 50% 85%, rgba(74, 59, 82, 0.7), transparent 55%),
      linear-gradient(160deg, #7c6488 0%, #6b5876 45%, #4a3b52 100%);
    background-attachment: fixed;
  }
 
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }
 
  .glow-1 {
    width: 320px;
    height: 320px;
    background: var(--gold);
    top: -80px;
    left: -60px;
    animation: drift1 22s ease-in-out infinite;
  }
 
  .glow-2 {
    width: 260px;
    height: 260px;
    background: var(--coral);
    bottom: -60px;
    right: -40px;
    animation: drift2 26s ease-in-out infinite;
  }
 
  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(30px, 40px); }
  }
 
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-30px, -30px); }
  }
 
  @media (prefers-reduced-motion: reduce) {
    .glow-1, .glow-2 {
      animation: none;
    }
  }
 
  h1, #gallery, #hint, #overlay {
    position: relative;
    z-index: 1;
  }
 
  h1 {
    color: var(--paper);
    margin-bottom: 24px;
    font-size: clamp(20px, 5vw, 28px);
    line-height: 1.3;
    text-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
 
  #gallery {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(14px, 4vw, 24px);
    max-width: 900px;
  }
 
  .reveal-image {
    width: min(180px, 40vw);
    height: min(180px, 40vw);
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    object-fit: cover;
    -webkit-tap-highlight-color: transparent;
  }
 
  .reveal-image:hover {
    transform: scale(1.03);
    box-shadow: 0 14px 36px rgba(0,0,0,0.2);
  }
 
  .reveal-image:active {
    transform: scale(0.97);
  }
 
  .image-wrapper {
    position: relative;
    width: min(180px, 40vw);
    height: min(180px, 40vw);
  }
 
  .image-wrapper .reveal-image {
    width: 100%;
    height: 100%;
  }
 
  .image-wrapper.locked .reveal-image,
  .image-wrapper.coming-soon .reveal-image {
    cursor: not-allowed;
    filter: grayscale(60%) brightness(0.55);
    pointer-events: none;
  }
 
  .image-wrapper.locked:hover .reveal-image,
  .image-wrapper.coming-soon:hover .reveal-image {
    transform: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
 
  .badge {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #fff;
    pointer-events: none;
    border-radius: 16px;
  }
 
  .badge .icon {
    font-size: clamp(24px, 8vw, 32px);
  }
 
  .badge .label {
    font-size: clamp(11px, 3vw, 13px);
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    background: rgba(0,0,0,0.55);
    padding: 4px 10px;
    border-radius: 999px;
  }
 
  #hint {
    margin-top: 18px;
    color: rgba(255, 250, 243, 0.75);
    font-size: clamp(13px, 3.5vw, 14px);
  }
 
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
 
  #overlay.show {
    display: flex;
    opacity: 1;
  }
 
  #popup {
    background: #fff;
    padding: clamp(24px, 6vw, 32px) clamp(20px, 5vw, 28px);
    border-radius: 16px;
    max-width: 480px;
    width: 90%;
    text-align: center;
    box-shadow: 0 25px 60px rgba(20, 12, 24, 0.45);
    transform: scale(0.9);
    transition: transform 0.25s ease;
    position: relative;
    box-sizing: border-box;
  }
 
  #overlay.show #popup {
    transform: scale(1);
  }
 
  #popup-message {
    text-align: left;
    margin: 10px 0 24px;
  }
 
  #popup-message p {
    font-size: clamp(16px, 4vw, 18px);
    color: #2d2a26;
    line-height: 1.6;
    margin: 0 0 14px;
  }
 
  #popup-message p:last-child {
    margin-bottom: 0;
  }
 
  #popup-close {
    background: #2d2a26;
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 999px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
 
  #popup-close:hover {
    background: #4a453d;
  }
 
  #popup-close:active {
    background: #4a453d;
    transform: scale(0.97);
  }
 
 
  @media (max-width: 380px) {
    body { padding: 16px; }
    #popup { width: 92%; }
  }
</style>

</head>
<body>

  <h1>HAPPY MONTHSARY!</h1>
 
  <div id="gallery"></div>
  <div id="hint">(click any image!)</div>
 
  <div id="overlay">
    <div id="popup">
      <p id="popup-message"></p>
      <button id="popup-close">Close</button>
    </div>
  </div>
 
  <audio id="song" preload="auto"></audio>

  <script>
   const items = [
      {
        image: "/simson.jfif",
        message: "July 18, 2026 \n\nIt's been a month since we decided to get back together, to be honest I don't know how I'll feel, may halong takot at saya. Natatakot ako na baka masaktan ulit kita tas piliin ulit natin iend yung meron tayo before kesa ayusin or pagusapan, but at the same time I'm happy because I've found my peace again, I've found you again.\n\n I love you so much🫶\n\nYou mean everything to me. I'm so lucky that you came into my life, worth it mabuhay pag ikaw yung kasama. HAPPY MONTHSARY, BABY! I LOVE YOU SO MUCH.",
        songSrc: "/Tahanan.mp3",
        startTime: 0,
        status: "unlocked"
      },
      {
        image: "/cat.jfif",
        message: "Aug 18, 2026 \n\nIt's been two months since we got back together. Nakalimutan ko na yung ganitong pakiramdam, yung pakiramdam na kasama ka, yung may Franzen Lih A. Mallari sa buhay hahaha ang saya pala, I'm so lucky to feel this again. Thank you baby for giving me the chance nakakasama ka ulit after lahat ng ginagawa ko binigyan mo parin ako ng chance. \n\nKaluguran daka sobra🫶 \n\nThis time I'll do better, i will love you better than before, i promise na hindi na kita iiwan, hindi ko na hahayaan mangyari yun. I'll be here for you forever. HAPPY MONTHSARY!! I LOVE YOU SO MUCH MY FRANZEN",
        songSrc: "/Tahan.mp3",
        startTime: 0,
        status: "unlocked"
      },
      {
        image: "/draw.jpg",
        message: "Sept 18, 2026 \n\nIt's been 3 months since we choose us again. I know we still have a lot to go through in our relationship, but I hope we keep choosing each other. Gusto ko tayo ang magkasama sa mga good and bad days nating pareho, gusto ko ikaw yung uuwian ko after a long day tas yayakapin ng pahigpit, and gusto ko rin na ikaw yung huling makikita ko bago matulog tas ikaw rin yung unang makikita pag gising. \n\nhinigugma ko ikaw🫶 \n\nI'll always be here for you, I'll be your own safe space in this world. HAPPY MONTHSARY! I LOVE YOU SO MUCH!",
        songSrc: "/Palagi.mp3",
        startTime: 48,
        status: "Unlocked"
      },
      {
        image: "/patric.jfif",
        message: "💌 And message #3!",
        songSrc: "song3.mp3",
        startTime: 0,
        status: "coming-soon"
      },
      {
        image: "/couple.webp",
        message: "💌 And message #3!",
        songSrc: "song3.mp3",
        startTime: 0,
        status: "locked"
      }
    ];
 
    const gallery = document.getElementById('gallery');
    const overlay = document.getElementById('overlay');
    const popupMessage = document.getElementById('popup-message');
    const closeBtn = document.getElementById('popup-close');
    const song = document.getElementById('song');
 
    // Build the gallery from the config above
    items.forEach((item, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'image-wrapper';
 
      const img = document.createElement('img');
      img.src = item.image;
      img.alt = "Click me";
      img.className = "reveal-image";
 
      wrapper.appendChild(img);
 
      if (item.status === 'locked') {
        wrapper.classList.add('locked');
        const badge = document.createElement('div');
        badge.className = 'badge';
        badge.innerHTML = '<span class="icon">🔒</span><span class="label">Locked</span>';
        wrapper.appendChild(badge);
      } else if (item.status === 'coming-soon') {
        wrapper.classList.add('coming-soon');
        const badge = document.createElement('div');
        badge.className = 'badge';
        badge.innerHTML = '<span class="icon">⏳</span><span class="label">Coming Soon</span>';
        wrapper.appendChild(badge);
      } else {
        // Only unlocked images are clickable
        img.addEventListener('click', () => openPopup(index));
      }
 
      gallery.appendChild(wrapper);
    });
 
    function openPopup(index) {
      const item = items[index];
 

      popupMessage.innerHTML = '';
      item.message
        .split(/\n\s*\n/)
        .map(part => part.trim())
        .filter(Boolean)
        .forEach(paragraph => {
          const p = document.createElement('p');
          p.textContent = paragraph;
          popupMessage.appendChild(p);
        });
 
      overlay.classList.add('show');
 
      // Swap in this item's song and start it at the configured time
      song.src = item.songSrc;
      song.currentTime = item.startTime;
      song.play().catch((err) => {
        console.log('Playback was blocked or failed:', err);
      });
    }
 
    function closePopup() {
      overlay.classList.remove('show');
      song.pause();
    }
 
    closeBtn.addEventListener('click', closePopup);
 
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closePopup();
    });
 
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePopup();
    });
  </script>

</body>
</html>
